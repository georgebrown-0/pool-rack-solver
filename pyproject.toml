[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-rack-solver"
version = "0.1.0"
description = "A solver for finding the minimum ball swaps required to correct an English pool rack."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]